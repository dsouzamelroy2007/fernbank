name: bff-ci

on:
  push:
    branches: [main]
    paths:
      - "bff/**"
      - ".github/workflows/bff-ci.yml"
  pull_request:
    paths:
      - "bff/**"
      - ".github/workflows/bff-ci.yml"

defaults:
  run:
    working-directory: bff

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bff/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
