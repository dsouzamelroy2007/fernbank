services:
  - name: fernbank-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    # Liveness, not the plain aggregate /actuator/health - that one includes a DB
    # connectivity check (auto-registered since JPA/a DataSource are on the classpath),
    # which can legitimately report 503 for a while after the JVM itself is already up,
    # since Neon has its own independent cold-start delay on top of the JVM's. Render's
    # own health check is used to decide "is this instance alive, should traffic route
    # to it" - a liveness-style question that should never depend on an external
    # dependency's own startup timing (the readiness/DB-dependent question is what the
    # bff's own warmup check already asks separately, over the public URL - see
    # bff/src/warmup/warmup.controller.ts). Suspected root cause of Render's edge
    # persistently rate-limiting wake-up requests with `hibernate-rate-limited`: if
    # Render's own health check kept seeing 503 here during the Neon-wait window and
    # didn't have the patience for it, it would repeatedly conclude this service failed
    # to come up cleanly on wake - confirmed with Render support (2026-08-31) that a
    # 429 hibernate-rate-limited response never reaches the app or logs a resume event,
    # meaning it's decided entirely at Render's edge before their own control plane
    # gets involved.
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: docker,prod
      - key: JWT_ISSUER
        value: https://fernbank-api.onrender.com   # confirm exact assigned URL, adjust if Render suffixes it
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: MFA_SECRET_ENCRYPTION_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # the Vercel domain
      - key: ACTUATOR_PROMETHEUS_USER
        sync: false
      - key: ACTUATOR_PROMETHEUS_PASSWORD
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false   # must be the SAME value as fernbank-bff's INTERNAL_SERVICE_KEY below

  - name: fernbank-bff
    type: web
    runtime: docker
    plan: free
    dockerfilePath: bff/Dockerfile
    dockerContext: bff
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4000"
      - key: BACKEND_INTERNAL_BASE_URL
        value: https://fernbank-api.onrender.com   # backend's PUBLIC Render URL - no private network on the free plan
      - key: BFF_SESSION_ENCRYPTION_KEY
        sync: false
      - key: BFF_CORS_ALLOWED_ORIGINS
        sync: false   # the Vercel domain
      - key: INTERNAL_SERVICE_KEY
        sync: false   # must be the SAME value as fernbank-api's INTERNAL_SERVICE_KEY above
