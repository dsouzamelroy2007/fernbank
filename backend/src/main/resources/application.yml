spring:
  application:
    name: ledger
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fernbank}
    username: ${DB_USER:fernbank}
    password: ${DB_PASSWORD:fernbank}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

fernbank:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    access-token-ttl: 10m
    refresh-token-ttl: 30d
    mfa-challenge-ttl: 5m
    step-up-ttl: 5m
    private-key-pem: ${JWT_PRIVATE_KEY:}
    public-key-pem: ${JWT_PUBLIC_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  auth:
    recovery-code-count: 10
    login-rate-limit-attempts: 5
    login-rate-limit-window: 15m
    # Minor units, currency-agnostic for v1 (same-currency-only scope). Default 100000
    # = 1000.00 for a 2-decimal currency like USD/EUR.
    step-up-threshold-minor-units: ${STEP_UP_THRESHOLD_MINOR_UNITS:100000}
    # Shared secret with the bff (same value on both services' env). When present and
    # matched on an incoming /auth/login request, the request's X-Forwarded-For header
    # is trusted as the real client IP for LoginRateLimiter instead of the TCP peer
    # address - which is otherwise always the bff's own container IP, since the bff
    # calls this backend over its own outbound HTTPS connection, not a shared one.
    # Blank (default) means never trust X-Forwarded-For - safe default for local/
    # Docker Compose, and for any deployment that hasn't set this on both sides yet.
    internal-service-key: ${INTERNAL_SERVICE_KEY:}
  metrics:
    # Local-dev-only defaults, same convention as DB_PASSWORD's plaintext local
    # default - set real values via env in any shared/deployed environment.
    prometheus-user: ${ACTUATOR_PROMETHEUS_USER:prometheus}
    prometheus-password: ${ACTUATOR_PROMETHEUS_PASSWORD:prometheus}
